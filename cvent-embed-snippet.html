<!--
  Paste this into a Cvent "Custom HTML" block on the post-registration
  confirmation page. It embeds the share widget and auto-resizes the iframe to
  fit the content.
-->
<iframe
  id="gg-widget"
  src="https://gg-postregistration-sharewidget.vercel.app/"
  width="100%"
  height="450"
  style="border:none;display:block;overflow:hidden;"
  scrolling="no"
  title="GG Post-Registration Share"
  loading="lazy"
></iframe>
<script>
  window.addEventListener("message", function (e) {
    if (e.data && e.data.ggWidgetHeight) {
      document.getElementById("gg-widget").height = e.data.ggWidgetHeight;
    }
  });
</script>
